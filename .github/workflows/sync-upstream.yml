name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Aethersailor/Custom_OpenClash_Rules.git
          git fetch upstream main

          before_merge="$(git rev-parse HEAD)"

          # These paths are maintained by this fork. Restore them before the
          # merge commit is created so conflicts here cannot stop the sync.
          protected_paths=(
            ".github/workflows"
            ".gitmodules"
            "cfg/Custom_Clash.ini"
            "cfg/Custom_Clash_Mainland.ini"
            "cfg/yaml/OpenClash_Overwrite"
            "overwrite/OpenClash_Overwrite"
          )

          if ! git merge --no-commit --no-ff upstream/main; then
            # A conflicted merge has MERGE_HEAD. Any other merge error is fatal.
            git rev-parse --verify -q MERGE_HEAD >/dev/null || exit 1
          fi

          git restore --source="$before_merge" --staged --worktree -- "${protected_paths[@]}"

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "::error::Upstream merge has conflicts outside fork-maintained paths:"
            printf '%s\n' "$unresolved"
            git merge --abort
            exit 1
          fi

          if git rev-parse --verify -q MERGE_HEAD >/dev/null; then
            git commit --no-edit
          else
            echo "Already up to date."
          fi

          git push origin HEAD:main
